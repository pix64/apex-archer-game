<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Anti-Proxy QR Attendance System</title>
    
    <!-- External Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            color: #f8fafc;
        }

        .app-card {
            background: #1e293b;
            width: 100%;
            max-width: 440px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            padding: 20px;
            border: 1px solid #334155;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            color: #f8fafc;
            font-size: 22px;
            margin-bottom: 4px;
        }

        .header p {
            color: #94a3b8;
            font-size: 13px;
        }

        .role-selector {
            display: flex;
            background: #0f172a;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .role-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #94a3b8;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .role-btn.active {
            background: #2563eb;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 12px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #334155;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background: #0f172a;
            color: #fff;
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            border: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 6px;
        }

        .download-btn {
            background: #059669;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            margin-top: 10px;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        .alert-box {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 16px;
            display: none;
            text-align: center;
            font-weight: 600;
            line-height: 1.4;
        }

        .alert-box.error { background: rgba(220, 38, 38, 0.2); color: #fca5a5; border: 1px solid #dc2626; }
        .alert-box.success { background: rgba(22, 163, 74, 0.2); color: #86efac; border: 1px solid #16a34a; }
        .alert-box.info { background: rgba(37, 99, 235, 0.2); color: #93c5fd; border: 1px solid #2563eb; }

        .user-info-bar {
            background: #0f172a;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logout-btn {
            color: #ef4444;
            cursor: pointer;
            font-weight: 700;
            border: none;
            background: transparent;
        }

        .scanner-container {
            position: relative;
            width: 100%;
            height: 280px;
            border-radius: 16px;
            overflow: hidden;
            margin-top: 16px;
            background: #000;
            border: 2px solid #334155;
            display: none;
        }

        #reader {
            width: 100%;
            height: 100%;
        }

        #reader video {
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
        }

        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scanner-box {
            width: 200px;
            height: 200px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            position: relative;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.55);
        }

        .scanner-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #38bdf8;
            border-style: solid;
        }

        .corner-tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 12px; }
        .corner-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 12px; }
        .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 12px; }
        .corner-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 12px; }

        .laser-line {
            width: 100%;
            height: 3px;
            background: #38bdf8;
            box-shadow: 0 0 12px #38bdf8;
            position: absolute;
            top: 0;
            animation: scanAnimation 2s infinite ease-in-out;
        }

        @keyframes scanAnimation {
            0% { top: 0%; }
            50% { top: 98%; }
            100% { top: 0%; }
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 11px;
        }

        .attendance-table th, .attendance-table td {
            border: 1px solid #334155;
            padding: 8px;
            text-align: center;
        }

        .attendance-table th {
            background: #0f172a;
            color: #38bdf8;
        }

        .badge-present { color: #4ade80; font-weight: 700; }

        .clear-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            float: right;
            margin-top: 10px;
        }

        .status-dot {
            height: 8px;
            width: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }

        .status-dot.online { background-color: #22c55e; }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
    </style>
</head>
<body>

<div class="app-card">

    <!-- LOGIN VIEW -->
    <div id="login-view" class="view-section active">
        <div class="header">
            <h2>Attendance Portal</h2>
            <p>Select role to login</p>
        </div>

        <div class="role-selector">
            <button type="button" class="role-btn active" id="btn-role-student" onclick="setRole('student')">Student</button>
            <button type="button" class="role-btn" id="btn-role-teacher" onclick="setRole('teacher')">Teacher</button>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" id="user-fullname" placeholder="Enter Full Name" required>
            </div>
            <div class="form-group">
                <label id="id-label">Roll Number</label>
                <input type="text" id="username" placeholder="Enter Roll Number" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>
            <button type="submit" class="submit-btn">Login</button>
        </form>
        <div id="login-alert" class="alert-box error"></div>
    </div>

    <!-- STUDENT VIEW -->
    <div id="student-view" class="view-section">
        <div class="user-info-bar">
            <div>
                <strong id="student-display-name"></strong><br>
                <span style="color: #94a3b8;">Roll: <span id="student-display-id"></span></span>
            </div>
            <button type="button" class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="header">
            <h2>Live Anti-Proxy Scanner</h2>
            <p>Scan classroom QR code in real-time</p>
        </div>

        <button type="button" class="submit-btn" id="scan-start-btn" onclick="startScanner()">Open Live Camera</button>
        
        <div class="scanner-container" id="scanner-wrapper">
            <div id="reader"></div>
            <div class="scanner-overlay">
                <div class="scanner-box">
                    <div class="scanner-corner corner-tl"></div>
                    <div class="scanner-corner corner-tr"></div>
                    <div class="scanner-corner corner-bl"></div>
                    <div class="scanner-corner corner-br"></div>
                    <div class="laser-line"></div>
                </div>
            </div>
        </div>

        <div id="student-alert" class="alert-box"></div>
    </div>

    <!-- TEACHER VIEW -->
    <div id="teacher-view" class="view-section">
        <div class="user-info-bar">
            <div>
                <strong id="teacher-display-name"></strong><br>
                <span style="color: #94a3b8;">Emp ID: <span id="teacher-display-id"></span></span>
            </div>
            <button type="button" class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="header">
            <h2>Anti-Proxy QR Broadcast</h2>
            <p><span class="status-dot" id="sync-dot"></span><span id="sync-status">Connecting Live Sync...</span></p>
        </div>

        <form onsubmit="handleGenerateQR(event)">
            <div class="grid-2">
                <div class="form-group"><label>Class</label><input type="text" id="class-name" placeholder="e.g. III CSE" required></div>
                <div class="form-group"><label>Section</label><input type="text" id="class-section" placeholder="e.g. A" required></div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Subject</label><input type="text" id="subject-name" placeholder="e.g. DBMS" required></div>
                <div class="form-group"><label>Subject Code</label><input type="text" id="subject-code" placeholder="e.g. CS3491" required></div>
            </div>
            <div class="grid-2">
                <div class="form-group"><label>Topic</label><input type="text" id="topic-name" placeholder="e.g. Normalization" required></div>
                <div class="form-group"><label>Period</label><input type="number" id="period" min="1" max="8" required></div>
            </div>
            <button type="submit" class="submit-btn" style="background: #16a34a;">Start Live Session</button>
        </form>

        <div id="qr-output" style="display: none; text-align: center; margin-top: 16px;">
            <div id="qr-code-container" style="display: flex; justify-content: center; background: #fff; padding: 12px; border-radius: 12px; margin: 0 auto; width: fit-content;"></div>

            <div style="overflow: hidden; margin-top: 16px; margin-bottom: 8px;">
                <h3 style="float: left; font-size: 13px; color: #cbd5e1;">Live Attendance Roster:</h3>
                <button type="button" class="clear-btn" onclick="clearRoster()">Clear Session</button>
            </div>

            <table class="attendance-table">
                <thead><tr><th>Roll No</th><th>Name</th><th>Time</th><th>Status</th></tr></thead>
                <tbody id="attendance-roster-body">
                    <tr><td colspan="4" style="color: #64748b;">Waiting for live scans...</td></tr>
                </tbody>
            </table>

            <button type="button" class="download-btn" onclick="downloadPDF()">Download Attendance PDF</button>
        </div>
    </div>

</div>

<script>
    const MQTT_TOPIC = "kcet/qr_attendance_system_live_v17";
    const client = mqtt.connect('wss://broker.emqx.io:8084/mqtt');

    let attendanceRecords = [];
    let currentRole = 'student';
    let loggedInUser = '';
    let loggedInName = '';
    let html5QrCode = null;
    let classDetails = {};
    let qrRefreshInterval = null;

    client.on('connect', () => {
        const dot = document.getElementById('sync-dot');
        const status = document.getElementById('sync-status');
        if (dot) dot.classList.add('online');
        if (status) status.innerText = 'Engine Online & Connected';
        client.subscribe(MQTT_TOPIC, (err) => {
            if (!err) {
                console.log("Subscribed successfully to topic:", MQTT_TOPIC);
            }
        });
    });

    client.on('message', (topic, message) => {
        if (topic === MQTT_TOPIC) {
            handleIncomingData(message.toString());
        }
    });

    window.addEventListener('storage', (event) => {
        if (event.key === 'sync_attendance_payload' && event.newValue) {
            handleIncomingData(event.newValue);
        }
    });

    function handleIncomingData(rawString) {
        try {
            const data = JSON.parse(rawString);
            if (data.type === 'CLEAR') {
                attendanceRecords = [];
            } else if (data.type === 'ATTENDANCE') {
                const existingIndex = attendanceRecords.findIndex(r => r.rollNo === data.rollNo);
                if (existingIndex === -1) {
                    attendanceRecords.push({
                        rollNo: data.rollNo,
                        name: data.name,
                        timestamp: data.timestamp,
                        status: data.status
                    });
                } else {
                    attendanceRecords[existingIndex].timestamp = data.timestamp;
                }
            }
            renderRosterTable();
        } catch(e) {
            console.error("Data parsing error:", e);
        }
    }

    function setRole(role) {
        currentRole = role;
        document.getElementById('btn-role-student').classList.toggle('active', role === 'student');
        document.getElementById('btn-role-teacher').classList.toggle('active', role === 'teacher');
        document.getElementById('id-label').innerText = role === 'student' ? 'Roll Number' : 'Employee ID';
    }

    function handleLogin(e) {
        e.preventDefault();
        loggedInName = document.getElementById('user-fullname').value.trim();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const alertBox = document.getElementById('login-alert');

        if (currentRole === 'student') {
            // Allow all users to log in freely
            if (pass === user) {
                loggedInUser = user;
                document.getElementById('student-display-name').innerText = loggedInName;
                document.getElementById('student-display-id').innerText = user;
                switchView('student-view');
            } else {
                showAlert(alertBox, 'Password must match Roll Number');
            }
        } else {
            if (pass.endsWith(`@${user}`)) {
                loggedInUser = user;
                document.getElementById('teacher-display-name').innerText = loggedInName;
                document.getElementById('teacher-display-id').innerText = user;
                switchView('teacher-view');
                renderRosterTable();
            } else {
                showAlert(alertBox, 'Use format: [Year]@[ID]');
            }
        }
    }

    async function startScanner() {
        const studentAlert = document.getElementById('student-alert');
        const scannerWrapper = document.getElementById('scanner-wrapper');

        showAlert(studentAlert, 'Activating live camera...', 'info');

        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                stream.getTracks().forEach(track => track.stop());
            }

            if (html5QrCode) {
                try { await html5QrCode.stop(); } catch(e){}
            }

            scannerWrapper.style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");

            const cameraConfig = { fps: 30, qrbox: { width: 200, height: 200 } };

            await html5QrCode.start(
                { facingMode: "environment" },
                cameraConfig,
                onScanSuccess,
                onScanFailure
            ).catch(async () => {
                await html5QrCode.start(
                    { facingMode: "user" },
                    cameraConfig,
                    onScanSuccess,
                    onScanFailure
                );
            });

            showAlert(studentAlert, 'Scanner active! Point camera directly at classroom board.', 'info');

        } catch (err) {
            console.error(err);
            showAlert(studentAlert, 'Camera Error: Enable permissions and refresh.', 'error');
        }
    }

    function onScanSuccess(decodedText) {
        const studentAlert = document.getElementById('student-alert');
        
        try {
            // PAYLOAD: ATTEND|SubCode|Sec|Period|TimestampMS
            const parts = decodedText.split('|');
            if (parts.length >= 5 && parts[0] === 'ATTEND') {
                const [_, subCode, sec, period, qrTimeStr] = parts;
                const qrTimestamp = parseInt(qrTimeStr, 10);
                const currentTimestamp = Date.now();
                const latency = currentTimestamp - qrTimestamp;

                if (latency > 1200) {
                    showAlert(studentAlert, '❌ EXPIRED QR! Photos or remote video calls are rejected.', 'error');
                    return;
                }

                // Create a unique session key based on Subject Code, Section, and Period
                const sessionKey = `attended_${subCode}_${sec}_P${period}_${loggedInUser}`;
                if (localStorage.getItem(sessionKey) === 'true') {
                    showAlert(studentAlert, `❌ Attendance already marked for Roll Number ${loggedInUser} in this section/session!`, 'error');
                    if (html5QrCode) {
                        html5QrCode.stop().then(() => {
                            document.getElementById('scanner-wrapper').style.display = 'none';
                        });
                    }
                    return;
                }

                const markTime = new Date().toLocaleTimeString();

                const payload = {
                    type: 'ATTENDANCE',
                    rollNo: loggedInUser,
                    name: loggedInName,
                    status: 'PRESENT',
                    timestamp: markTime,
                    sessionKey: sessionKey
                };

                // Mark session as attended for this roll number
                localStorage.setItem(sessionKey, 'true');

                const payloadString = JSON.stringify(payload);

                client.publish(MQTT_TOPIC, payloadString, { qos: 1 });
                localStorage.setItem('sync_attendance_payload', payloadString);

                handleIncomingData(payloadString);
                
                showAlert(studentAlert, '✅ Attendance Verified and Marked Present!', 'success');

                if (html5QrCode) {
                    html5QrCode.stop().then(() => {
                        document.getElementById('scanner-wrapper').style.display = 'none';
                    });
                }
            } else {
                showAlert(studentAlert, 'Invalid QR format.', 'error');
            }
        } catch(e) {
            showAlert(studentAlert, 'Error processing QR frame.', 'error');
        }
    }

    function onScanFailure(error) {}

    function handleGenerateQR(e) {
        e.preventDefault();
        classDetails = {
            className: document.getElementById('class-name').value,
            section: document.getElementById('class-section').value,
            subject: document.getElementById('subject-name').value,
            subjectCode: document.getElementById('subject-code').value,
            topic: document.getElementById('topic-name').value,
            period: document.getElementById('period').value
        };

        document.getElementById('qr-output').style.display = 'block';

        if (qrRefreshInterval) clearInterval(qrRefreshInterval);

        updateDynamicQR();
        qrRefreshInterval = setInterval(updateDynamicQR, 1200);
    }

    function updateDynamicQR() {
        const qrContainer = document.getElementById('qr-code-container');
        qrContainer.innerHTML = '';

        const timestamp = Date.now();
        const payloadStr = `ATTEND|${classDetails.subjectCode}|${classDetails.section}|P${classDetails.period}|${timestamp}`;

        new QRCode(qrContainer, { 
            text: payloadStr, 
            width: 180, 
            height: 180,
            correctLevel: QRCode.CorrectLevel.L
        });
    }

    function getSortedRecords() {
        return [...attendanceRecords].sort((a, b) => {
            return a.rollNo.localeCompare(b.rollNo, undefined, { numeric: true, sensitivity: 'base' });
        });
    }

    function renderRosterTable() {
        const rosterBody = document.getElementById('attendance-roster-body');
        if (!rosterBody) return;

        const sorted = getSortedRecords();

        if (sorted.length === 0) {
            rosterBody.innerHTML = '<tr><td colspan="4" style="color: #64748b;">Waiting for live scans...</td></tr>';
            return;
        }

        rosterBody.innerHTML = sorted.map(item => `
            <tr>
                <td><strong>${item.rollNo}</strong></td>
                <td>${item.name}</td>
                <td>${item.timestamp || 'N/A'}</td>
                <td class="badge-present">${item.status}</td>
            </tr>
        `).join('');
    }

    function clearRoster() {
        if (confirm("Clear attendance list for this session?")) {
            const clearPayload = JSON.stringify({ type: 'CLEAR' });
            client.publish(MQTT_TOPIC, clearPayload);
            localStorage.setItem('sync_attendance_payload', clearPayload);
            
            attendanceRecords = [];
            renderRosterTable();
        }
    }

    function downloadPDF() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();

        const sorted = getSortedRecords();
        const presentCount = sorted.length;

        doc.setFontSize(16);
        doc.text("CLASS ATTENDANCE REPORT (VERIFIED PHYSICAL PRESENCE)", 14, 15);

        doc.setFontSize(10);
        doc.text(`Class - Section: ${classDetails.className || 'N/A'} - ${classDetails.section || 'N/A'}`, 14, 25);
        doc.text(`Period: Period ${classDetails.period || 'N/A'}`, 120, 25);
        
        doc.text(`Subject: ${classDetails.subject || 'N/A'} (${classDetails.subjectCode || 'N/A'})`, 14, 32);
        doc.text(`Topic: ${classDetails.topic || 'N/A'}`, 120, 32);

        doc.text(`Faculty Name: ${loggedInName} (ID: ${loggedInUser})`, 14, 39);
        doc.text(`Total Students Present: ${presentCount}`, 120, 39);

        const tableBody = sorted.map((item, index) => [
            index + 1,
            item.rollNo,
            item.name,
            item.timestamp || 'N/A',
            item.status
        ]);

        doc.autoTable({
            startY: 45,
            head: [['S.No', 'Roll Number', 'Student Name', 'Time', 'Status']],
            body: tableBody,
            theme: 'grid',
            headStyles: { fillColor: [37, 99, 235] },
            columnStyles: {
                0: { cellWidth: 15 },
                1: { cellWidth: 35 },
                2: { cellWidth: 70 },
                3: { cellWidth: 35 },
                4: { cellWidth: 35 }
            }
        });

        doc.save(`Attendance_${classDetails.subjectCode || 'Session'}_P${classDetails.period || '1'}.pdf`);
    }

    function switchView(viewId) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
    }

    function logout() {
        if (html5QrCode) { 
            try { 
                html5QrCode.stop(); 
                document.getElementById('scanner-wrapper').style.display = 'none';
            } catch(e){} 
        }
        if (qrRefreshInterval) clearInterval(qrRefreshInterval);
        switchView('login-view');
    }

    function showAlert(el, msg, type = 'error') {
        el.className = `alert-box ${type}`;
        el.innerText = msg;
        el.style.display = 'block';
    }
</script>

</body>
</html>
