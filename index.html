<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart QR Attendance System</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0f172a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 12px;
            color: #f8fafc;
        }

        .app-card {
            background: #1e293b;
            width: 100%;
            max-width: 420px;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            padding: 20px;
            border: 1px solid #334155;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .header h2 {
            color: #f8fafc;
            font-size: 22px;
            margin-bottom: 4px;
        }

        .header p {
            color: #94a3b8;
            font-size: 13px;
        }

        .role-selector {
            display: flex;
            background: #0f172a;
            padding: 4px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .role-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: transparent;
            color: #94a3b8;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .role-btn.active {
            background: #2563eb;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 13px;
            color: #cbd5e1;
            font-weight: 600;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #334155;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            background: #0f172a;
            color: #fff;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            border: none;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 6px;
        }

        .view-section {
            display: none;
        }

        .view-section.active {
            display: block;
        }

        .alert-box {
            padding: 12px 14px;
            border-radius: 10px;
            font-size: 13px;
            margin-top: 16px;
            display: none;
            text-align: center;
            font-weight: 600;
            line-height: 1.4;
        }

        .alert-box.error { background: rgba(220, 38, 38, 0.2); color: #fca5a5; border: 1px solid #dc2626; }
        .alert-box.success { background: rgba(22, 163, 74, 0.2); color: #86efac; border: 1px solid #16a34a; }
        .alert-box.info { background: rgba(37, 99, 235, 0.2); color: #93c5fd; border: 1px solid #2563eb; }

        .user-info-bar {
            background: #0f172a;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 16px;
            font-size: 13px;
            display: flex;
            justify-content: space-between;
        }

        .logout-btn {
            color: #ef4444;
            cursor: pointer;
            font-weight: 700;
            border: none;
            background: transparent;
        }

        .scanner-container {
            position: relative;
            width: 100%;
            height: 280px;
            border-radius: 16px;
            overflow: hidden;
            margin-top: 16px;
            background: #000;
            border: 2px solid #334155;
            display: none;
        }

        #reader {
            width: 100%;
            height: 100%;
        }

        #reader video {
            object-fit: cover !important;
            width: 100% !important;
            height: 100% !important;
        }

        .scanner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .scanner-box {
            width: 200px;
            height: 200px;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 16px;
            position: relative;
            box-shadow: 0 0 0 4000px rgba(0, 0, 0, 0.55);
        }

        .scanner-corner {
            position: absolute;
            width: 20px;
            height: 20px;
            border-color: #38bdf8;
            border-style: solid;
        }

        .corner-tl { top: -2px; left: -2px; border-width: 4px 0 0 4px; border-top-left-radius: 12px; }
        .corner-tr { top: -2px; right: -2px; border-width: 4px 4px 0 0; border-top-right-radius: 12px; }
        .corner-bl { bottom: -2px; left: -2px; border-width: 0 0 4px 4px; border-bottom-left-radius: 12px; }
        .corner-br { bottom: -2px; right: -2px; border-width: 0 4px 4px 0; border-bottom-right-radius: 12px; }

        .laser-line {
            width: 100%;
            height: 3px;
            background: #38bdf8;
            box-shadow: 0 0 12px #38bdf8;
            position: absolute;
            top: 0;
            animation: scanAnimation 2s infinite ease-in-out;
        }

        @keyframes scanAnimation {
            0% { top: 0%; }
            50% { top: 98%; }
            100% { top: 0%; }
        }

        .attendance-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 12px;
            font-size: 12px;
        }

        .attendance-table th, .attendance-table td {
            border: 1px solid #334155;
            padding: 10px;
            text-align: center;
        }

        .attendance-table th {
            background: #0f172a;
            color: #38bdf8;
        }

        .badge-present {
            color: #4ade80;
            font-weight: 700;
        }
    </style>
</head>
<body>

<div class="app-card">

    <!-- LOGIN SECTION -->
    <div id="login-view" class="view-section active">
        <div class="header">
            <h2>Attendance Portal</h2>
            <p>Select role to login</p>
        </div>

        <div class="role-selector">
            <button type="button" class="role-btn active" id="btn-role-student" onclick="setRole('student')">Student</button>
            <button type="button" class="role-btn" id="btn-role-teacher" onclick="setRole('teacher')">Teacher</button>
        </div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label id="username-label">Roll Number</label>
                <input type="text" id="username" placeholder="Enter Roll Number" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter Password" required>
            </div>
            <button type="submit" class="submit-btn">Login</button>
        </form>
        <div id="login-alert" class="alert-box error"></div>
    </div>

    <!-- STUDENT VIEW -->
    <div id="student-view" class="view-section">
        <div class="user-info-bar">
            <span>Student: <strong id="student-display-id"></strong></span>
            <button type="button" class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="header">
            <h2>QR Scanner</h2>
            <p>Tap below to launch live QR scanner</p>
        </div>

        <button type="button" class="submit-btn" id="scan-start-btn" onclick="startScanner()">Open QR Scanner</button>
        
        <div class="scanner-container" id="scanner-wrapper">
            <div id="reader"></div>
            <div class="scanner-overlay">
                <div class="scanner-box">
                    <div class="scanner-corner corner-tl"></div>
                    <div class="scanner-corner corner-tr"></div>
                    <div class="scanner-corner corner-bl"></div>
                    <div class="scanner-corner corner-br"></div>
                    <div class="laser-line"></div>
                </div>
            </div>
        </div>

        <div id="student-alert" class="alert-box"></div>
    </div>

    <!-- TEACHER VIEW -->
    <div id="teacher-view" class="view-section">
        <div class="user-info-bar">
            <span>Teacher: <strong id="teacher-display-id"></strong></span>
            <button type="button" class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <div class="header">
            <h2>Create Class QR</h2>
            <p>Generate QR for attendance</p>
        </div>

        <form onsubmit="handleGenerateQR(event)">
            <div class="form-group"><label>Subject Code</label><input type="text" id="subject-code" placeholder="e.g. CS3491" required></div>
            <div class="form-group"><label>Section</label><input type="text" id="class-section" placeholder="e.g. A" required></div>
            <div class="form-group"><label>Period</label><input type="number" id="period" min="1" max="8" required></div>
            <button type="submit" class="submit-btn" style="background: #16a34a;">Generate QR</button>
        </form>

        <div id="qr-output" style="display: none; text-align: center; margin-top: 16px;">
            <div id="qr-code-container" style="display: flex; justify-content: center; background: #fff; padding: 12px; border-radius: 12px; margin: 0 auto; width: fit-content;"></div>
            
            <h3 style="margin-top: 16px; font-size: 14px; text-align: left; color: #cbd5e1;">Live Attendance Roster:</h3>
            <table class="attendance-table">
                <thead><tr><th>Roll No</th><th>Time</th><th>Status</th></tr></thead>
                <tbody id="attendance-roster-body">
                    <tr><td colspan="3" style="color: #64748b;">Waiting for student scans...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<script>
    let currentRole = 'student';
    let loggedInUser = '';
    let html5QrCode = null;

    function setRole(role) {
        currentRole = role;
        document.getElementById('btn-role-student').classList.toggle('active', role === 'student');
        document.getElementById('btn-role-teacher').classList.toggle('active', role === 'teacher');
        document.getElementById('username-label').innerText = role === 'student' ? 'Roll Number' : 'Employee ID';
    }

    function handleLogin(e) {
        e.preventDefault();
        const user = document.getElementById('username').value.trim();
        const pass = document.getElementById('password').value.trim();
        const alertBox = document.getElementById('login-alert');

        if (currentRole === 'student') {
            if (pass === user) {
                loggedInUser = user;
                document.getElementById('student-display-id').innerText = user;
                switchView('student-view');
            } else {
                showAlert(alertBox, 'Password must match Roll Number');
            }
        } else {
            if (pass.endsWith(`@${user}`)) {
                loggedInUser = user;
                document.getElementById('teacher-display-id').innerText = user;
                switchView('teacher-view');
                loadRoster();
            } else {
                showAlert(alertBox, 'Use format: [Year]@[ID]');
            }
        }
    }

    async function startScanner() {
        const studentAlert = document.getElementById('student-alert');
        const scannerWrapper = document.getElementById('scanner-wrapper');

        if (window.location.protocol === 'file:' || window.location.protocol === 'content:') {
            showAlert(studentAlert, 'Local file mode detected! Mobile browsers block camera permissions on local files. Please run via Live Server (http://) or host online.', 'error');
            return;
        }

        showAlert(studentAlert, 'Requesting camera permission...', 'info');

        try {
            if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                stream.getTracks().forEach(track => track.stop());
            }

            if (html5QrCode) {
                try { await html5QrCode.stop(); } catch(e){}
            }

            scannerWrapper.style.display = 'block';
            html5QrCode = new Html5Qrcode("reader");

            const cameraConfig = { fps: 15, qrbox: { width: 200, height: 200 } };

            await html5QrCode.start(
                { facingMode: "environment" },
                cameraConfig,
                onScanSuccess,
                onScanFailure
            ).catch(async () => {
                await html5QrCode.start(
                    { facingMode: "user" },
                    cameraConfig,
                    onScanSuccess,
                    onScanFailure
                );
            });

            showAlert(studentAlert, 'Scanner active! Align QR inside target box.', 'info');

        } catch (err) {
            console.error("Camera launch error:", err);
            showAlert(studentAlert, 'Camera Permission Error: Allow camera access in browser site settings and reload.', 'error');
        }
    }

    function onScanSuccess(decodedText) {
        const studentAlert = document.getElementById('student-alert');
        if (decodedText && decodedText.startsWith("ATTEND|")) {
            
            // 1. Save scan record in localStorage
            const timeStr = new Date().toLocaleTimeString();
            const newRecord = { rollNo: loggedInUser, time: timeStr, status: 'PRESENT' };
            
            let roster = JSON.parse(localStorage.getItem('attendanceRoster') || '[]');
            
            // Prevent duplicate entries for the same student
            if (!roster.some(item => item.rollNo === loggedInUser)) {
                roster.push(newRecord);
                localStorage.setItem('attendanceRoster', JSON.stringify(roster));
            }

            showAlert(studentAlert, 'Attendance Marked Successfully!', 'success');
            
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    document.getElementById('scanner-wrapper').style.display = 'none';
                });
            }
        } else {
            showAlert(studentAlert, 'Invalid QR Code scanned.', 'error');
        }
    }

    function onScanFailure(error) {}

    function handleGenerateQR(e) {
        e.preventDefault();
        const code = document.getElementById('subject-code').value;
        const sec = document.getElementById('class-section').value;
        const period = document.getElementById('period').value;

        const qrContainer = document.getElementById('qr-code-container');
        qrContainer.innerHTML = '';
        new QRCode(qrContainer, { text: `ATTEND|${code}|${sec}|P${period}`, width: 180, height: 180 });
        document.getElementById('qr-output').style.display = 'block';
        loadRoster();
    }

    function loadRoster() {
        const rosterBody = document.getElementById('attendance-roster-body');
        const roster = JSON.parse(localStorage.getItem('attendanceRoster') || '[]');

        if (roster.length === 0) {
            rosterBody.innerHTML = '<tr><td colspan="3" style="color: #64748b;">Waiting for student scans...</td></tr>';
            return;
        }

        rosterBody.innerHTML = roster.map(item => `
            <tr>
                <td><strong>${item.rollNo}</strong></td>
                <td>${item.time}</td>
                <td class="badge-present">${item.status}</td>
            </tr>
        `).join('');
    }

    // Auto update teacher table across tabs/windows in real-time
    window.addEventListener('storage', (e) => {
        if (e.key === 'attendanceRoster') {
            loadRoster();
        }
    });

    function switchView(viewId) {
        document.querySelectorAll('.view-section').forEach(v => v.classList.remove('active'));
        document.getElementById(viewId).classList.add('active');
    }

    function logout() {
        if (html5QrCode) { 
            try { 
                html5QrCode.stop(); 
                document.getElementById('scanner-wrapper').style.display = 'none';
            } catch(e){} 
        }
        switchView('login-view');
    }

    function showAlert(el, msg, type = 'error') {
        el.className = `alert-box ${type}`;
        el.innerText = msg;
        el.style.display = 'block';
    }
</script>

</body>
</html>
